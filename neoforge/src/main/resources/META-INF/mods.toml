modLoader = "javafml"
loaderVersion = "[1,)"
#issueTrackerURL = ""
license="${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json"
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/"
logoFile = "${mod_icon}"
#credits=""
authors = "${mod_author}"
description = '''${mod_description}'''

[[mixins]]
config="${mod_id}-common.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge_version_major}.${neoforge_version_minor},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${mc_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "cloth_config"
    type = "required"
    versionRange = "[${cloth_config_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "lunar"
    type = "optional"
    versionRange = ""
    ordering = "NONE"
    side = "BOTH"
