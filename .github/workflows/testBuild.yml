name: Test Build

on:
  workflow_dispatch:
    push:
    branches:
      - '1.20.1'
    paths:
      - 'common/**'
      - 'fabric/**'
      - 'forge/**'
      - '**.gradle'
      - '**.properties'


jobs:
  build_1_20_1:
    name: Build 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'oracle'
          java-version: 17
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '1.20.1'
      - name: Build
        run: ./gradlew build --stacktrace
