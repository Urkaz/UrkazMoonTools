architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    //accessWidenerPath = file("src/main/resources/urkazmoontools.accesswidener")
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Remove the next line if you don't want to depend on the API
    //modImplementation "dev.architectury:architectury:${rootProject.architectury_version}"

    // Cloth Config
    if (test_enable_cloth_config.toBoolean()) {
        modImplementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
            exclude(group: "net.fabricmc.fabric-api")
        }
    } else {
        modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
            exclude(group: "net.fabricmc.fabric-api")
        }
    }

    // Enhanced Celestials. We use the forge version, but do NOT use classes from forge loader
    if (test_enable_enhanced_celestials.toBoolean()) {
        modImplementation "curse.maven:enhanced-celestials-fabric-${ec_fabric_projectid}:${ec_fabric_fileids}"
        modRuntimeOnly "curse.maven:corgilib-693313:${corgilib_fabric_fileids}"
        modCompileOnly "curse.maven:data-anchor-1203668:${dataanchor_fabric_fileids}"
    } else {
        modCompileOnly "curse.maven:enhanced-celestials-fabric-${ec_fabric_projectid}:${ec_fabric_fileids}"
        modRuntimeOnly "curse.maven:corgilib-693313:${corgilib_fabric_fileids}"
        modCompileOnly "curse.maven:data-anchor-1203668:${dataanchor_fabric_fileids}"
    }

    // Lunar
    if (test_enable_lunar.toBoolean()) {
        modImplementation "maven.modrinth:lunar:${lunar_fabric_projectid}"
    } else {
        modCompileOnly "maven.modrinth:lunar:${lunar_fabric_projectid}"
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            version = rootProject.version + "-mc" + minecraft_version
            from components.java
        }
    }
}