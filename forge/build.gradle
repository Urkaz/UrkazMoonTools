plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    //accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        //convertAccessWideners = true
        //extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "urkazmoontools-common.mixins.json"
        //mixinConfig "urkazmoontools.mixins.json"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version_major}.${rootProject.forge_version_minor}.${rootProject.forge_version_patch}"
    // Remove the next line if you don't want to depend on the API
    //modImplementation "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Cloth Config
    if (test_enable_cloth_config.toBoolean()) {
        modImplementation "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
    } else {
        modCompileOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
    }

    // Enhanced Celestials
    if (test_enable_enhanced_celestials.toBoolean()) {
        modImplementation "curse.maven:enhanced-celestials-forge-${ec_forge_projectid}:${ec_forge_fileids}"
        modRuntimeOnly "curse.maven:corgilib-693313:${corgilib_forge_fileids}"
        modRuntimeOnly "curse.maven:data-anchor-1203668:${dataanchor_forge_fileids}"
    } else {
        modCompileOnly "curse.maven:enhanced-celestials-forge-${ec_forge_projectid}:${ec_forge_fileids}"
        modRuntimeOnly "curse.maven:corgilib-693313:${corgilib_forge_fileids}"
        modRuntimeOnly "curse.maven:data-anchor-1203668:${dataanchor_forge_fileids}"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
                "mod_id": rootProject.mod_id,
                "mod_name": rootProject.mod_name,
                "mod_description": rootProject.mod_description,
                "mod_license": rootProject.mod_license,
                "mod_icon": rootProject.mod_icon,
                "mod_author": rootProject.mod_author,
                "mc_version": project.minecraft_version,
                "forge_version_major": project.forge_version_major,
                "forge_version_minor": project.forge_version_minor,
                "cloth_config_version": project.cloth_config_version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    exclude "urkazmoontools.accesswidener"
    exclude "urkazmoontools.mixins.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            version = rootProject.version + "-mc" + minecraft_version
            from components.java
        }
    }
}

unifiedPublishing {
    project {
        displayName = "[Forge $rootProject.minecraft_version] $project.mod_name v$project.version"
        gameLoaders = ["forge"]
        version = "$project.version"
        releaseType = "release"
        gameVersions = ["$project.minecraft_version"]
        changelog = rootProject.file("Changelog.md").text

        mainPublication tasks.remapJar

        relations {
            depends {
                curseforge = "cloth-config"
                modrinth = "cloth-config"
            }
            if (cm_mod_compat_enabled.toBoolean()) {
                optional {
                    curseforge = "crimson-moon"
                }
            }
            if (ec_mod_compat_enabled.toBoolean()) {
                optional {
                    curseforge = "enhanced-celestials"
                    modrinth = "enhanced-celestials"
                }
            }
        }

        if (project.hasProperty("cuseforge_api_key") || System.getenv("cuseforge_api_key") != null) {
            curseforge {
                token = project.hasProperty("cuseforge_api_key") ? project.property("cuseforge_api_key") : System.getenv("cuseforge_api_key")
                id = "${project.curseforge_id}"
                gameVersions.addAll "Java 17"
            }
        }

        if (project.hasProperty("modrinth_api_key") || System.getenv("modrinth_api_key") != null) {
            modrinth {
                token = project.hasProperty("modrinth_api_key") ? project.property("modrinth_api_key") : System.getenv("modrinth_api_key")
                id = "${project.modrinth_id}"
            }
        }
    }
}

rootProject.tasks.getByName("modPublish").dependsOn tasks.getByName("publishUnified")
