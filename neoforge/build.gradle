plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    neoForge {
        //accessWidenerPath = project(":common").loom.accessWidenerPath
    }
    runs {
        client {
            property 'mixin.debug', 'true' // Tells neoforge to have debug on for Mixins
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version_major}.${rootProject.neoforge_version_minor}.${rootProject.neoforge_version_patch}"
    // Remove the next line if you don't want to depend on the API
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
                "mod_id": rootProject.mod_id,
                "mod_name": rootProject.mod_name,
                "mod_description": rootProject.mod_description,
                "mod_license": rootProject.mod_license,
                "mod_icon": rootProject.mod_icon,
                "mod_author": rootProject.mod_author,
                "mc_version": project.minecraft_version,
                "neoforge_version_major": project.neoforge_version_major,
                "neoforge_version_minor": project.neoforge_version_minor,
                "cloth_config_version": project.cloth_config_version,
                "architectury_version": project.architectury_version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    exclude "urkazmoontools.accesswidener"
    exclude "urkazmoontools.mixins.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = base.archivesName.get()
            version = rootProject.version + "-mc" + minecraft_version
            from components.java
        }
    }
}

unifiedPublishing {
    project {
        displayName = "[NeoForge $rootProject.minecraft_version] $project.mod_name v$project.version"
        gameLoaders = ["neoforge"]
        version = "$project.version"
        releaseType = "release"
        gameVersions = ["$project.minecraft_version"]

        mainPublication tasks.remapJar

        relations {
            depends {
                curseforge = "architectury-api"
                modrinth = "architectury-api"
            }
            optional {
                curseforge = "cloth-config"
                modrinth = "cloth-config"
            }
        }

        if (project.hasProperty("cuseforge_api_key") || System.getenv("cuseforge_api_key") != null) {
            curseforge {
                token = project.hasProperty("cuseforge_api_key") ? project.property("cuseforge_api_key") : System.getenv("cuseforge_api_key")
                id = "${project.curseforge_id}"
                gameVersions.addAll "Java 17"
            }
        }

        if (project.hasProperty("modrinth_api_key") || System.getenv("modrinth_api_key") != null) {
            modrinth {
                token = project.hasProperty("modrinth_api_key") ? project.property("modrinth_api_key") : System.getenv("modrinth_api_key")
                id = "${project.modrinth_id}"
            }
        }
    }
}

rootProject.tasks.getByName("modPublish").dependsOn tasks.getByName("publishUnified")
